<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Question Section -->
        <div id="questionContainer">
            <div class="image-container">
                <!-- Stable Unsplash Image: Cute Teddy Bear -->
                <img src="https://images.unsplash.com/photo-1585338107529-13afc5f02586?q=80&w=400&auto=format&fit=crop"
                    alt="Cute Bear">
            </div>

            <h1 class="header_text">Will you be my Valentine?</h1>

            <div class="buttons">
                <button id="yesBtn" class="btn btn-yes">Yes</button>
                <button id="noBtn" class="btn btn-no">No</button>
            </div>
        </div>

        <!-- Celebration Section -->
        <div id="celebrationContainer" class="celebration-container">
            <!-- Branching Roses Corners (using stable Wikimedia PNG) -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Rose_Simple.svg/512px-Rose_Simple.svg.png"
                class="rose-corner rose-tl" alt="Rose">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Rose_Simple.svg/512px-Rose_Simple.svg.png"
                class="rose-corner rose-tr" alt="Rose">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Rose_Simple.svg/512px-Rose_Simple.svg.png"
                class="rose-corner rose-bl" alt="Rose">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Rose_Simple.svg/512px-Rose_Simple.svg.png"
                class="rose-corner rose-br" alt="Rose">

            <div class="image-container">
                <!-- Yoshitomo Nara Style Image: "Aomori-Ken" Dog -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Aomori_Museum_of_Art_Aomori_dog.JPG/600px-Aomori_Museum_of_Art_Aomori_dog.JPG"
                    alt="Yoshitomo Nara Dog">
            </div>
            <h1 class="header_text">Yay!!! I knew you would say yes! <br> ❤️❤️❤️</h1>

            <!-- Little Pictures / Decorations (Fixed Links) -->
            <div class="deco-item deco-1">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Heart_coraz%C3%B3n.svg/240px-Heart_coraz%C3%B3n.svg.png"
                    alt="Heart" width="40">
            </div>
            <div class="deco-item deco-2">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Heart_coraz%C3%B3n.svg/240px-Heart_coraz%C3%B3n.svg.png"
                    alt="Heart" width="50">
            </div>
            <div class="deco-item deco-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Full_Star_Yellow.svg/240px-Full_Star_Yellow.svg.png"
                    alt="Star" width="40">
            </div>
            <div class="deco-item deco-4">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Full_Star_Yellow.svg/240px-Full_Star_Yellow.svg.png"
                    alt="Star" width="30">
            </div>
        </div>
    </div>

    <!-- Keeping Confetti because it's awesome -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
