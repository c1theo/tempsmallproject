<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Question Section -->
        <div id="questionContainer">
            <div class="image-container">
                <!-- Cute Bear/Cat for Pink Theme (Stable Link) -->
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExODg3bnZrbW84cHM1eXJ6c2J5ZmI5eWJ5ZmI5eWJ5ZmI5eWJ5ZmI5eSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif"
                    alt="Cute Bear">
            </div>

            <h1 class="header_text">Will you be my Valentine?</h1>

            <div class="buttons">
                <button id="yesBtn" class="btn btn-yes">Yes</button>
                <button id="noBtn" class="btn btn-no">No</button>
            </div>
        </div>

        <!-- Celebration Section -->
        <div id="celebrationContainer" class="celebration-container">
            <div class="image-container">
                <!-- Celebration Kiss/Heart (Stable Link) -->
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmo3c3l5ODh3ZGN6NHhhaDE2Mjg1ZjkwOXczdDFxbWM3dTBtaW9xiSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/T86i6yDyOYz7y/giphy.gif"
                    alt="Celebration Kiss">
            </div>
            <h1 class="header_text">Yay!!! I knew you would say yes! <br> ❤️❤️❤️</h1>
        </div>
    </div>

    <!-- Keeping Confetti because it's awesome -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
