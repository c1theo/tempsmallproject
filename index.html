<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Question Section -->
        <div id="questionContainer">
            <div class="image-container">
                <!-- Reliable Wikimedia Image: Teddy Bear -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Teddy_bear_at_the_Children%27s_Museum_of_Indianapolis.jpg/600px-Teddy_bear_at_the_Children%27s_Museum_of_Indianapolis.jpg"
                    alt="Cute Bear">
            </div>

            <h1 class="header_text">Will you be my Valentine?</h1>

            <div class="buttons">
                <button id="yesBtn" class="btn btn-yes">Yes</button>
                <button id="noBtn" class="btn btn-no">No</button>
            </div>
        </div>

        <!-- Celebration Section -->
        <div id="celebrationContainer" class="celebration-container">
            <div class="image-container">
                <!-- Yoshitomo Nara Style Image: "Aomori-Ken" Dog -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Aomori_Museum_of_Art_Aomori_dog.JPG/600px-Aomori_Museum_of_Art_Aomori_dog.JPG"
                    alt="Yoshitomo Nara Dog">
            </div>
            <h1 class="header_text">Yay!!! I knew you would say yes! <br> ❤️❤️❤️</h1>
        </div>
    </div>

    <!-- Keeping Confetti because it's awesome -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
