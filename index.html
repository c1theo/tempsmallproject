<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>

    <!-- Google Fonts: Gloria Hallelujah for that handwritten/marker feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <div class="container">
        <!-- Question Section -->
        <div id="questionContainer">
            <div class="image-container">
                <!-- A "grumpy/cute" cat illustration that fits the Nara vibe -->
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbm83aG54bm05ZzR6bm05ZzR6bm05ZzR6bm05ZzR6bm05ZzR6bm05ZCZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/l41lFj8af0CZq/giphy.gif"
                    alt="Grumpy Cute Cat">
            </div>

            <h1 class="header_text">Will you be my Valentine?</h1>

            <div class="buttons">
                <button id="yesBtn" class="btn btn-yes">Yes</button>
                <button id="noBtn" class="btn btn-no">No</button>
            </div>
        </div>

        <!-- Celebration Section -->
        <div id="celebrationContainer" class="celebration-container">
            <div class="image-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaG54bm05ZzR6bm05ZzR6bm05ZzR6bm05ZzR6bm05ZzR6bm05ZCZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/3o7TKRwo1k4u0k2m6k/giphy.gif"
                    alt="Celebration Dance">
            </div>

            <h1 class="header_text">Yay!!! <br> I knew it! <br> ❤️❤️❤️</h1>

            <!-- Little Pictures / Decorations -->
            <div class="deco-item deco-1">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNTZrdnZ1MmR0c3V5bm9vN2NqNXJ5b2Z5b2Z5b2Z5b2Z5b2Z5bSZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/l41lFj8af0CZq/giphy.gif"
                    alt="Mini Cat" width="50">
            </div>
            <div class="deco-item deco-2">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNzh6Nzh6Nzh6Nzh6Nzh6Nzh6Nzh6Nzh6Nzh6Nzh6Nzh6Nzh6qyZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/3o7TKRwo1k4u0k2m6k/giphy.gif"
                    alt="Mini Dance" width="60">
            </div>
            <div class="deco-item deco-3">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnZ5YnZ5YnZ5YnZ5YnZ5YnZ5YnZ5YnZ5YnZ5YnZ5YnZ5YnZiSZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/HCLbhUDRzDGY0/giphy.gif"
                    alt="Star" width="40">
            </div>
            <div class="deco-item deco-4">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnZ5YnZ5YnZ5YnZ5YnZ5YnZ5YnZ5YnZ5YnZ5YnZ5YnZ5YnZiSZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/HCLbhUDRzDGY0/giphy.gif"
                    alt="Star" width="30">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
